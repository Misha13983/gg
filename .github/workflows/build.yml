name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Create resources
      run: |
        mkdir -p src/main/resources/META-INF
        echo 'eyJwYWNrIjp7ImRlc2NyaXB0aW9uIjoiRHVwZSBNb2QiLCJwYWNrX2Zvcm1hdCI6MTV9fQ==' | base64 -d > src/main/resources/pack.mcmeta
        echo '' | base64 -d > src/main/resources/META-INF/mods.toml
    
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: dupe-mod
        path: build/libs/*.jar
