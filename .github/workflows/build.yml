name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Create resources
      run: |
        mkdir -p src/main/resources/META-INF
        printf '{"pack":{"description":"Dupe Mod","pack_format":15}}' > src/main/resources/pack.mcmeta
        printf 'modLoader="javafml"\nloaderVersion="[47,)"\nlicense="MIT"\n\n[[mods]]\nmodId="dupe_mod"\nversion="1.0.0"\ndisplayName="Dupe Mod"\ndescription="Dupe Mod"\nauthors="You"\n\n[[dependencies.dupe_mod]]\nmodId="forge"\nmandatory=true\nversionRange="[47,)"\nordering="NONE"\nside="BOTH"\n\n[[dependencies.dupe_mod]]\nmodId="minecraft"\nmandatory=true\nversionRange="[1.20.1]"\nordering="NONE"\nside="BOTH"' > src/main/resources/META-INF/mods.toml
    
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: dupe-mod
        path: build/libs/*.jar
